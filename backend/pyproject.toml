[project]
name = "agent-backend"
version = "0.1.0"
description = "Real pydantic-ai agent backend for apps/ssr-agent"
requires-python = ">=3.13"
dependencies = [
  "pydantic-ai-slim[anthropic]>=2.47.0",
  "fastapi>=0.141.0",
  "uvicorn[standard]>=0.53.0",
  "sqlalchemy[asyncio]>=2.0.54",
  "alembic>=1.20.0",
  "asyncpg>=0.31.0",
  "python-dotenv>=1.2.1",
  "httpx>=0.28.0",
  "opentelemetry-sdk>=1.45.1",
  "opentelemetry-instrumentation-fastapi>=0.66b1",
  "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=1.0.0",
  "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
